[supervisord]
nodaemon=true
user=gcms
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Optional worker for single-container deployments.
; Docker Compose runs queue workers as a dedicated service.
[program:queue]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
autostart=false
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
